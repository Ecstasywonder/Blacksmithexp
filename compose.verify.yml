name: chairly-verification

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: chairly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - verification_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chairly"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    image: chairly-migrator:local
    command:
      [
        "sh",
        "-c",
        "pnpm db:migrate && pnpm --filter @chairly/database booking-slice:reset",
      ]
    environment:
      MIGRATION_DATABASE_URL: postgresql://chairly_migrator:chairly_migrator@postgres:5432/chairly
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: chairly-web:local
    environment:
      DATABASE_URL: postgresql://chairly_app:chairly_app@postgres:5432/chairly
      AUTH_SESSION_SECRET: chairly-local-verification-secret
      APP_ORIGIN: http://127.0.0.1:3000
    ports:
      - "127.0.0.1:3210:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  verify:
    profiles: ["verify"]
    network_mode: service:web
    build:
      context: .
      dockerfile: Dockerfile.verify
    image: chairly-verification:local
    environment:
      DATABASE_URL: postgresql://chairly_app:chairly_app@postgres:5432/chairly
      MIGRATION_DATABASE_URL: postgresql://chairly_migrator:chairly_migrator@postgres:5432/chairly
      AUTH_SESSION_SECRET: chairly-local-verification-secret
      APP_ORIGIN: http://127.0.0.1:3000
      CHAIRLY_E2E_BASE_URL: http://127.0.0.1:3000
      CI: "true"
    shm_size: 1gb
    init: true
    depends_on:
      web:
        condition: service_healthy

volumes:
  verification_data:
