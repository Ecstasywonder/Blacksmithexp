name: chairly-booking-slice

services:
  postgres:
    image: postgres:16
    container_name: chairly-booking-slice-postgres
    environment:
      POSTGRES_DB: chairly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chairly"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "55432:5432"
    volumes:
      - chairly_booking_slice_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  chairly_booking_slice_postgres_data:
