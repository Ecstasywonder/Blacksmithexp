name: chairly

services:
  postgres:
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 0.75
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: chairly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${CHAIRLY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - chairly_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chairly"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  migrate:
    image: chairly-migrator:local
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      MIGRATION_DATABASE_URL: postgresql://chairly_migrator:chairly_migrator@postgres:5432/chairly
      CHAIRLY_DATABASE_RUNTIME_ROLE: chairly_app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 1.0
    image: chairly-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    environment:
      DATABASE_URL: postgresql://chairly_app:chairly_app@postgres:5432/chairly
      CHAIRLY_DATABASE_RUNTIME_ROLE: chairly_app
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-chairly-local-container-secret-2026}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${CHAIRLY_WEB_PORT:-3000}:3000"
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    restart: unless-stopped

volumes:
  chairly_postgres_data:
