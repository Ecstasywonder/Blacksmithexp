name: Booking verification
on:
  pull_request:
  push:
    branches: [main, BEW-005]
permissions:
  contents: read
jobs:
  booking-verification:
    name: Booking guarantees and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chairly/e2e exec playwright install --with-deps chromium
      - run: pnpm verify:local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: booking-verification-failure
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
